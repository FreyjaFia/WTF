<div class="app-shell flex h-full flex-col bg-surface md:flex-row">
  <aside class="app-sidebar hidden h-full w-60 flex-none flex-col border-r border-gray-200 bg-surface md:flex" aria-label="Platform navigation">
    <div class="border-b border-gray-200 px-3 py-4">
      <div class="flex min-w-0 items-center gap-2 text-2xl font-bold tracking-widest">
        <span class="text-neutral">WTF</span>
        <span class="flex min-w-0 flex-col leading-tight">
          <span class="text-xs font-normal tracking-wider text-gray-500 uppercase">Platform</span>
          <span class="text-[10px] font-semibold tracking-wide text-gray-400">Shop administration</span>
        </span>
      </div>
    </div>
    <nav class="flex-1 space-y-1 overflow-y-auto px-2.5 py-4">
      @for (item of nav; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-gray-100 text-gray-900 sidebar-active"
          class="flex items-center gap-3 rounded-lg px-2.5 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50"
        >
          <app-icon [name]="item.icon" [class]="'h-4.5 w-4.5 text-gray-500'" />
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="border-t border-gray-200 p-2.5">
      <button
        type="button"
        class="flex w-full items-center gap-3 rounded-lg px-2.5 py-2 text-sm font-medium text-red-600 transition-colors hover:bg-red-50 active:bg-red-100"
        (click)="signOut()"
      >
        <app-icon name="icon-logout" [class]="'h-4.5 w-4.5 text-red-500'" />
        Sign out
      </button>
    </div>
  </aside>

  <header class="shrink-0 border-b border-gray-200 bg-surface md:hidden">
    <div class="flex items-center gap-3 px-4 py-3">
      <div class="flex min-w-0 items-center gap-2 text-xl font-bold tracking-widest">
        <span class="text-neutral">WTF</span>
        <span class="text-xs font-normal tracking-wider text-gray-500 uppercase">Platform</span>
      </div>
      <button type="button" class="app-btn app-btn-ghost app-btn-sm ml-auto" (click)="signOut()">Sign out</button>
    </div>
    <nav class="flex gap-1 overflow-x-auto overflow-y-hidden px-3 pb-2" aria-label="Platform navigation">
      @for (item of nav; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-gray-100 text-gray-900"
          class="shrink-0 rounded-lg px-3 py-1.5 text-sm font-medium text-gray-600"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </header>

  <main class="min-h-0 flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>
