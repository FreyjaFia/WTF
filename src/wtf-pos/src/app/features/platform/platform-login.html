<div class="flex min-h-full flex-col items-center justify-center gap-6 bg-gray-50 p-4">
  <form
    [formGroup]="form"
    (ngSubmit)="signIn()"
    class="w-full max-w-sm rounded-xl bg-surface p-8 shadow-lg"
    aria-label="Platform sign in"
  >
    <h1 class="mb-1 text-lg font-semibold text-gray-900">Platform</h1>
    <p class="mb-6 text-sm text-gray-500">Sign in to manage shops.</p>

    @if (error(); as message) {
      <div class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert">{{ message }}</div>
    }

    <label for="platform-username" class="mb-2 block text-sm font-medium text-gray-700">Name</label>
    <input
      id="platform-username"
      formControlName="username"
      type="text"
      autocomplete="username"
      class="mb-4 w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-gray-400 focus:outline-none"
    />

    <label for="platform-password" class="mb-2 block text-sm font-medium text-gray-700">Password</label>
    <input
      id="platform-password"
      formControlName="password"
      type="password"
      autocomplete="current-password"
      class="mb-6 w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-gray-400 focus:outline-none"
    />

    <button type="submit" class="app-btn app-btn-dark app-btn-md w-full" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>

  <div class="w-56">
    <app-theme-switcher [outlined]="true" placement="top-center" />
  </div>
</div>
