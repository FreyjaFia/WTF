<div class="flex min-h-full flex-col items-center justify-center">
  <!-- Logo -->
  <div class="mb-6 text-center">
    <img src="/assets/images/logo_new.png" alt="WTF Logo" class="mx-auto h-32 w-32" />
  </div>

  <!-- POS Portal Badge -->
  <div class="mb-8">
    <span class="rounded-full bg-black px-6 py-2 text-sm font-medium text-white">POS PORTAL</span>
  </div>

  <!-- Login Form -->
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">
    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()"
      [class.pointer-events-none]="checkingSession()"
      [class.opacity-70]="checkingSession()"
      [attr.aria-busy]="checkingSession() ? 'true' : null"
    >
      <!-- Username -->
      <div class="mb-4">
        <label for="username" class="mb-2 block text-sm font-medium text-gray-700">Username</label>
        <input
          id="username"
          formControlName="username"
          type="text"
          placeholder="Enter your username"
          [disabled]="checkingSession() || loading()"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-gray-400 focus:ring-1 focus:ring-gray-400 focus:outline-none"
        />
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="password" class="mb-2 block text-sm font-medium text-gray-700">Password</label>
        <div class="relative">
          <input
            id="password"
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            [disabled]="checkingSession() || loading()"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 pr-16 text-sm focus:border-gray-400 focus:ring-1 focus:ring-gray-400 focus:outline-none"
          />
          <button
            type="button"
            class="app-btn app-btn-ghost absolute inset-y-0 right-2 my-auto h-8 px-2 text-xs"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        [disabled]="checkingSession() || loading() || loginForm.invalid"
        class="app-btn app-btn-dark inline-flex w-full items-center justify-center py-3 text-sm"
      >
        @if (loading()) {
          <span class="loading loading-spinner loading-sm mr-2 text-white"></span>
          <span>Logging in...</span>
        } @else {
          <span>Login</span>
        }
      </button>
    </form>
  </div>

  <!-- Footer -->
  <div class="mt-8 text-center">
    <p class="mb-1 text-xs font-medium text-gray-400">Version v{{ appVersion }}</p>
    <p class="text-xs text-gray-500">
      © {{ currentYear }} Wake.Taste.Focus by Faith All rights reserved.
    </p>
  </div>
</div>

@if (showPendingSyncModal()) {
  <app-confirm-dialog
    icon="icon-cart"
    heading="Pending Offline Orders"
    confirmLabel="Go to Order List"
    (confirmed)="goToOrderList()"
    (cancelled)="dismissPendingSyncReminder()"
  >
    You still have
    <span class="font-medium text-gray-700">{{ pendingSyncCount() }}</span>
    order{{ pendingSyncCount() === 1 ? '' : 's' }} waiting to sync.
  </app-confirm-dialog>
}
