<div class="bg-surface flex h-full w-full flex-col rounded-t-2xl sm:-mt-4 md:mt-0">
  @if (showBackToHub()) {
    <div class="app-page-nav flex shrink-0 items-center gap-2 text-sm">
      <a
        [routerLink]="hubRoute"
        class="flex min-h-9 items-center gap-1 font-semibold text-gray-600 sm:hidden"
        data-testid="inventory-back"
      >
        <span aria-hidden="true">&larr;</span> Inventory
      </a>
      <a
        [routerLink]="hubRoute"
        class="hidden font-medium text-gray-500 hover:text-gray-700 sm:inline"
        data-testid="inventory-crumb"
        >Inventory</a
      >
      <span class="text-gray-400" aria-hidden="true">/</span>
      <app-section-switcher
        [groups]="switcherGroups()"
        hubLabel="Inventory"
        [hubRoute]="hubRoute"
        testIdPrefix="inventory"
      />
    </div>
  }

  <div class="flex h-full min-h-0 min-w-0 flex-1 flex-col">
    <router-outlet />
  </div>
</div>
