@if (branchService.isMultiBranch()) {
  <div class="dropdown z-35" [class.dropdown-end]="align() === 'end'" data-testid="branch-switcher">
    <button
      type="button"
      tabindex="0"
      class="app-btn app-btn-ghost flex max-w-28 items-center gap-1.5 px-2 py-1.5 text-sm font-semibold text-gray-700 sm:max-w-56"
      [attr.aria-label]="'Switch branch, current ' + branchService.activeLabel()"
      [attr.title]="branchService.activeLabel()"
      data-testid="branch-switcher-button"
    >
      <app-icon name="icon-storefront" [class]="'h-4.5 w-4.5 shrink-0 text-gray-500'" />
      @if (!compact()) {
        <span class="truncate">{{ branchService.activeCode() }}</span>
      }
    </button>
    <ul
      tabindex="0"
      class="dropdown-content menu bg-base-100 rounded-box z-50 mt-2 w-64 p-2 shadow max-sm:fixed max-sm:inset-x-4 max-sm:top-16 max-sm:w-auto"
      data-testid="branch-switcher-menu"
    >
      @if (isOffline()) {
        <li class="px-3 py-1 text-xs text-gray-500" data-testid="branch-offline-note">
          Offline: only the branch saved on this device can be opened.
        </li>
      }
      @if (branchService.canSeeAll()) {
        <li>
          <button
            type="button"
            class="app-menu-item disabled:cursor-not-allowed disabled:opacity-50"
            [class.font-bold]="branchService.isAllSelected()"
            data-testid="branch-option-all"
            [disabled]="!canChoose(allBranches)"
            (click)="choose(allBranches)"
          >
            All branches
          </button>
        </li>
      }
      @for (branch of branchService.branches(); track branch.id) {
        @if (branch.isActive) {
          <li>
            <button
              type="button"
              class="app-menu-item disabled:cursor-not-allowed disabled:opacity-50"
              [class.font-bold]="branch.id === branchService.activeId()"
              [attr.data-testid]="'branch-option-' + branch.code"
              [disabled]="!canChoose(branch.id)"
              (click)="choose(branch.id)"
            >
              <span class="truncate">{{ branch.name }}</span>
              <span class="ml-auto text-xs text-gray-400">{{ branch.code }}</span>
            </button>
          </li>
        }
      }
    </ul>
  </div>
}
