<button
  type="button"
  class="app-btn app-btn-secondary app-btn-sm gap-2"
  data-filters-button
  [attr.aria-label]="count() > 0 ? 'Filters, ' + count() + ' applied' : 'Filters'"
  (click)="pressed.emit()"
>
  <app-icon name="icon-filter" [class]="'h-4 w-4'" [fill]="'currentColor'" />
  Filters
  @if (count() > 0) {
    <span
      class="flex h-4 min-w-4 items-center justify-center rounded-full bg-ink px-1 text-[10px] leading-none font-semibold text-on-ink"
      data-filter-count
      >{{ count() }}</span
    >
  }
</button>
