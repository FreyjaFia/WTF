@if (visible()) {
  <div
    class="flex flex-col items-center gap-3 rounded-xl bg-surface px-4 py-3 shadow-lg ring-1 ring-gray-100 sm:flex-row sm:justify-between"
  >
    <div
      class="flex w-full flex-wrap items-center justify-between gap-x-4 gap-y-2 sm:w-auto sm:justify-start"
    >
      <label class="flex items-center gap-2 text-xs text-gray-500">
        <span>Rows per page</span>
        <select
          class="rounded-lg bg-surface px-2 py-1 text-sm text-gray-700 ring-1 ring-gray-200 focus:ring-2 focus:ring-gray-300 focus:outline-none"
          [disabled]="disabled()"
          (change)="changePageSize($event)"
        >
          @for (size of pageSizeOptions(); track size) {
            <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
          }
        </select>
      </label>
      <span class="text-xs text-gray-500">
        {{ firstRow() }} &ndash; {{ lastRow() }} of {{ totalCount() }}
      </span>
    </div>

    <nav
      class="flex w-full items-center justify-between gap-1 sm:w-auto sm:justify-end"
      [attr.aria-label]="label()"
    >
      <button
        type="button"
        class="app-btn app-btn-secondary app-btn-sm"
        [disabled]="disabled() || page() <= 1"
        (click)="goToPage(page() - 1)"
      >
        Previous
      </button>
      <div class="hidden items-center gap-1 sm:flex">
        @for (item of items(); track $index) {
          @if (item === null) {
            <span class="px-1 text-gray-400" aria-hidden="true">&hellip;</span>
          } @else {
            <button
              type="button"
              class="app-btn app-btn-sm"
              [class.app-btn-primary]="item === page()"
              [class.app-btn-secondary]="item !== page()"
              [attr.aria-current]="item === page() ? 'page' : null"
              [attr.aria-label]="'Page ' + item"
              [disabled]="disabled()"
              (click)="goToPage(item)"
            >
              {{ item }}
            </button>
          }
        }
      </div>
      <span class="text-xs text-gray-500 sm:hidden">
        Page {{ page() }} of {{ totalPages() }}
      </span>
      <button
        type="button"
        class="app-btn app-btn-secondary app-btn-sm"
        [disabled]="disabled() || page() >= totalPages()"
        (click)="goToPage(page() + 1)"
      >
        Next
      </button>
    </nav>
  </div>
}
