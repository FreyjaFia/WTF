@if (visible()) {
  <div
    class="bg-surface flex items-center justify-between gap-2 rounded-xl px-3 py-1.5 shadow-lg ring-1 ring-gray-100"
    data-testid="pagination"
  >
    <div class="flex min-w-0 items-center gap-3">
      <span class="text-xs whitespace-nowrap text-gray-500" data-testid="pagination-range">
        {{ firstRow() }} &ndash; {{ lastRow() }} of {{ totalCount() }}
      </span>
      <label class="hidden items-center gap-2 text-xs text-gray-500 sm:flex">
        <span>Rows per page</span>
        <select
          class="bg-surface rounded-lg px-2 py-1 text-sm text-gray-700 ring-1 ring-gray-200 focus:ring-2 focus:ring-gray-300 focus:outline-none"
          aria-label="Rows per page"
          [disabled]="disabled()"
          (change)="changePageSize($event)"
        >
          @for (size of pageSizeOptions(); track size) {
            <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
          }
        </select>
      </label>
    </div>

    <nav class="flex shrink-0 items-center gap-1" [attr.aria-label]="label()">
      <button
        type="button"
        class="app-btn app-btn-secondary app-btn-sm"
        [disabled]="disabled() || page() <= 1"
        (click)="goToPage(page() - 1)"
      >
        Previous
      </button>
      <div class="hidden items-center gap-1 sm:flex">
        @for (item of items(); track $index) {
          @if (item === null) {
            <span class="px-1 text-gray-400" aria-hidden="true">&hellip;</span>
          } @else {
            <button
              type="button"
              class="app-btn app-btn-sm"
              [class.app-btn-primary]="item === page()"
              [class.app-btn-secondary]="item !== page()"
              [attr.aria-current]="item === page() ? 'page' : null"
              [attr.aria-label]="'Page ' + item"
              [disabled]="disabled()"
              (click)="goToPage(item)"
            >
              {{ item }}
            </button>
          }
        }
      </div>
      <span class="px-1 text-xs whitespace-nowrap text-gray-500 sm:hidden">
        Page {{ page() }} of {{ totalPages() }}
      </span>
      <button
        type="button"
        class="app-btn app-btn-secondary app-btn-sm"
        [disabled]="disabled() || page() >= totalPages()"
        (click)="goToPage(page() + 1)"
      >
        Next
      </button>
    </nav>
  </div>
}
