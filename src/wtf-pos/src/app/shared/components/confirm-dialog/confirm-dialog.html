<div
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirm-dialog-title"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-md transition-opacity duration-200"
  (click)="!isBusy() && cancelled.emit()"
  (keydown.escape)="!isBusy() && cancelled.emit()"
  tabindex="0"
>
  <div
    role="document"
    class="mx-4 w-full max-w-sm animate-[modal-pop_0.2s_ease-out] rounded-2xl bg-white p-6 shadow-2xl"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <div [class]="styles().outerRing">
      <div [class]="styles().innerRing">
        <app-icon [name]="icon()" [class]="styles().icon" />
      </div>
    </div>

    <h3 id="confirm-dialog-title" class="mt-4 text-center text-lg font-semibold text-gray-900">
      {{ heading() }}
    </h3>
    <p class="mt-2 text-center text-sm leading-relaxed text-gray-500"><ng-content /></p>
    <ng-content select="[dialogExtra]" />

    <div class="mt-6 flex items-center justify-end gap-3">
      @if (confirmPlacement() === 'secondary') {
        <button type="button" [class]="secondaryButtonClass()" (click)="confirmed.emit()">
          {{ confirmLabel() }}
        </button>
        <button type="button" [class]="keepButtonClass" (click)="cancelled.emit()">
          {{ cancelLabel() }}
        </button>
      } @else {
        <button
          type="button"
          [class]="cancelButtonClass"
          (click)="cancelled.emit()"
          [disabled]="isBusy()"
        >
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          [class]="styles().confirmButton"
          (click)="confirmed.emit()"
          [disabled]="isBusy()"
        >
          @if (isBusy()) {
            <span class="loading loading-spinner loading-xs mr-2"></span>
          }
          {{ isBusy() && busyLabel() ? busyLabel() : confirmLabel() }}
        </button>
      }
    </div>
  </div>
</div>
