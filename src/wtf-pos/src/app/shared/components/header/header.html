<div class="navbar shrink-0 border-b border-gray-200 bg-surface px-3 shadow-md sm:px-6">
  <div class="flex-1">
    <a class="flex min-w-0 items-center gap-2 text-2xl font-bold tracking-tight">
      <span class="truncate text-neutral">{{ brand.displayName() }}</span>
    </a>
  </div>
  <div class="flex shrink-0 items-center gap-1 sm:gap-4">
    <app-branch-switcher />

    <app-staff-envelope />
    <app-needs-attention-button />
    <app-notification-bell />

    <div class="dropdown dropdown-end z-[35]">
      <div
        tabindex="0"
        role="button"
        class="avatar shrink-0 cursor-pointer rounded-full p-0.5 ring-2 ring-transparent transition-all hover:ring-brand/30 active:scale-95"
      >
        <div class="w-10 rounded-full">
          @if (imageUrl) {
            <img alt="User avatar" [src]="imageUrl" />
          } @else {
            <app-avatar [label]="userFullName" [size]="36"></app-avatar>
          }
        </div>
      </div>
      <app-profile-menu [userFullName]="userFullName" [userRoleLabel]="userRoleLabel" align="end" (logoutRequested)="logout()" />
    </div>
  </div>
</div>
