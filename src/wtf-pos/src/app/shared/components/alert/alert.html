<div
  class="app-toast toast-enter relative flex items-center gap-3 overflow-hidden rounded-xl border-l-4 py-3 pr-3 pl-3.5 text-sm shadow-[0_10px_32px_-8px_rgba(0,0,0,0.18)]"
  [class]="toastClass()"
  [class.toast-exit]="isDismissing()"
  [attr.data-type]="type()"
  role="alert"
>
  <span
    class="app-toast-icon flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-surface/70"
    aria-hidden="true"
  >
    <app-icon
      [name]="iconId"
      [fill]="'none'"
      [class]="'h-5 w-5 shrink-0 stroke-current ' + iconClass()"
    />
  </span>
  <span class="flex-1 font-medium" [class]="textClass()">{{ message() }}</span>
  @if (actionLabel()) {
    <button
      type="button"
      class="shrink-0 cursor-pointer rounded-md px-2 py-1 text-xs font-semibold transition-colors"
      [class]="closeClass()"
      (click)="onActionClick()"
    >
      {{ actionLabel() }}
    </button>
  }
  <button
    type="button"
    class="ml-auto shrink-0 cursor-pointer rounded-md p-1 transition-colors"
    [class]="closeClass()"
    (click)="dismiss()"
    aria-label="Close alert"
  >
    <app-icon name="icon-close" [fill]="'currentColor'" [class]="'h-4 w-4'" />
  </button>
  <!-- Shows how long the toast stays: it shrinks over the 4 seconds before it dismisses itself. -->
  <span class="app-toast-timer" [class]="iconClass()" aria-hidden="true"></span>
</div>
