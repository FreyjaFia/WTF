<button
  type="button"
  class="relative flex h-10 w-10 cursor-pointer items-center justify-center rounded-full text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 active:scale-95"
  [class.bg-gray-100]="isOpen()"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="dialog"
  data-bell
  (click)="toggle()"
>
  <app-icon name="icon-notifications" [class]="'h-5 w-5'" [fill]="'currentColor'" />
  @if (unread() > 0) {
    <span
      class="absolute -top-0.5 -right-0.5 flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[11px] leading-none font-bold text-white ring-2 ring-white"
      data-bell-badge
      >{{ badge() }}</span
    >
  }
</button>

@if (isOpen()) {
  <div
    class="fixed inset-x-3 top-16 z-50 max-h-[70vh] overflow-hidden rounded-xl border border-gray-200 bg-surface shadow-xl sm:absolute sm:inset-x-auto sm:top-auto sm:mt-2 sm:w-96"
    [class.sm:right-0]="align() === 'end'"
    [class.sm:left-0]="align() === 'start'"
    role="dialog"
    aria-label="Notifications"
    data-bell-panel
  >
    <div class="flex items-center justify-between border-b border-gray-100 px-4 py-3">
      <h2 class="text-sm font-bold text-gray-900">Notifications</h2>
      <button
        type="button"
        class="cursor-pointer text-xs font-semibold text-emerald-700 hover:underline disabled:cursor-default disabled:text-gray-400 disabled:no-underline"
        [disabled]="unread() === 0"
        data-bell-mark-all
        (click)="markAllRead()"
      >
        Mark all read
      </button>
    </div>

    <ul class="max-h-[calc(70vh-6.5rem)] divide-y divide-gray-50 overflow-y-auto">
      @if (isLoading() && items().length === 0) {
        <li class="flex justify-center py-8">
          <span class="loading loading-spinner loading-md"></span>
        </li>
      } @else if (items().length === 0) {
        <li class="px-4 py-8 text-center text-sm text-gray-400" data-bell-empty>
          You are all caught up.
        </li>
      } @else {
        @for (item of items(); track item.id) {
          <li>
            <button
              type="button"
              class="flex w-full cursor-pointer items-start gap-3 px-4 py-3 text-left transition-colors hover:bg-gray-50"
              [class]="item.isRead ? '' : style(item.severity).unread"
              data-bell-item
              [attr.data-unread]="!item.isRead"
              (click)="open(item)"
            >
              <span
                class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
                [class]="style(item.severity).icon"
              >
                <app-icon [name]="icon(item.kind)" [class]="'h-4 w-4'" [fill]="'currentColor'" />
              </span>
              <span class="min-w-0 flex-1">
                <span class="flex items-baseline justify-between gap-2">
                  <span
                    class="truncate text-sm text-gray-900"
                    [class.font-bold]="!item.isRead"
                    [class.font-semibold]="item.isRead"
                    >{{ item.title }}</span
                  >
                  <span class="shrink-0 text-xs text-gray-400">{{ ago(item.createdAt) }}</span>
                </span>
                <span class="block truncate text-xs text-gray-500">{{ item.body }}</span>
                @if (reminder(item)) {
                  <span class="mt-0.5 inline-block text-[10px] font-semibold text-amber-700 uppercase">{{
                    reminder(item)
                  }}</span>
                }
              </span>
              @if (!item.isRead) {
                <span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-red-500" aria-label="Unread"></span>
              }
            </button>
          </li>
        }
      }
    </ul>

    <a
      [routerLink]="seeAllRoute"
      class="block border-t border-gray-100 px-4 py-2.5 text-center text-sm font-semibold text-gray-700 hover:bg-gray-50"
      data-bell-see-all
      (click)="close()"
      >See all</a
    >
  </div>
}
