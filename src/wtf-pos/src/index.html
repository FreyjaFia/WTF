<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>WTF POS</title>
    <script>
      // Apply the saved style before the first paint so a dark style never flashes white.
      try {
        var savedTheme = localStorage.getItem('wtf-theme');
        if (savedTheme === 'cafe') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WTF POS" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/images/icon-192.png?v=3" />
    <link rel="shortcut icon" type="image/png" href="assets/images/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/images/icon-512.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
